<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drawing Pad</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #e0f7fa;
    }
    canvas {
      border: 2px solid black;
      background: #f0f0f0;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
      cursor: crosshair;
    }
  </style>
</head>
<body>

<canvas id="drawCanvas" width="500" height="400"></canvas>

<script>
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  canvas.onmousedown = () => isDrawing = true;
  canvas.onmouseup = () => isDrawing = false;
  canvas.onmousemove = (e) => {
    if (isDrawing) {
      ctx.fillStyle = 'black';
      ctx.beginPath();
      ctx.arc(e.offsetX, e.offsetY, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  };
</script>

</body>
</html>
